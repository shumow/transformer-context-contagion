#cloud-config
# Auto-deallocate-on-idle for the Track B GPU VM.
#
# A systemd timer fires every 5 min and runs idle-deallocate.sh, which keeps a
# "last active" timestamp. The VM is considered ACTIVE if either:
#   - any GPU's utilization is >= GPU_UTIL_THRESHOLD percent, or
#   - there is an interactive login session (`who` is non-empty).
# When neither has been true for IDLE_MINUTES, the VM deallocates *itself* via the
# Azure REST API, authenticating with its system-assigned managed identity (which
# `up.sh` grants Virtual Machine Contributor scoped to this VM only). Deallocate
# releases the compute and stops GPU billing -- a plain power-off would not.
#
# Tune live without redeploying:  sudo nano /etc/idle-deallocate.env  (no restart needed)
# Pin the VM awake for a long unattended CPU job:  sudo systemctl stop idle-deallocate.timer
# Watch decisions:                                 tail -f /var/log/idle-deallocate.log

write_files:
  - path: /etc/idle-deallocate.env
    permissions: '0644'
    content: |
      IDLE_MINUTES=30
      GPU_UTIL_THRESHOLD=5

  - path: /usr/local/bin/idle-deallocate.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      IDLE_MINUTES="${IDLE_MINUTES:-30}"
      GPU_UTIL_THRESHOLD="${GPU_UTIL_THRESHOLD:-5}"
      STATE=/var/run/idle-deallocate.last-active
      LOG=/var/log/idle-deallocate.log
      log(){ echo "$(date -Is) $*" >> "$LOG"; }

      now=$(date +%s)
      [ -f "$STATE" ] || echo "$now" > "$STATE"

      active=0
      maxutil=0
      if command -v nvidia-smi >/dev/null 2>&1; then
        maxutil=$(nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits \
                  | sort -rn | head -1 2>/dev/null || echo 0)
        [ "${maxutil:-0}" -ge "$GPU_UTIL_THRESHOLD" ] && active=1
      fi
      # any interactive (ssh/pts) login keeps the box awake
      if who 2>/dev/null | grep -q .; then active=1; fi

      if [ "$active" -eq 1 ]; then
        echo "$now" > "$STATE"
        log "ACTIVE  gpu=${maxutil}%  logins=$(who 2>/dev/null | wc -l)  -> reset"
        exit 0
      fi

      last=$(cat "$STATE" 2>/dev/null || echo "$now")
      idle_secs=$(( now - last ))
      idle_limit=$(( IDLE_MINUTES * 60 ))
      log "idle ${idle_secs}s / ${idle_limit}s  gpu=${maxutil}%"
      [ "$idle_secs" -lt "$idle_limit" ] && exit 0

      log "idle threshold reached -> deallocating self"
      imds='http://169.254.169.254/metadata'
      tok=$(curl -s -H Metadata:true \
        "${imds}/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" \
        | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
      meta=$(curl -s -H Metadata:true "${imds}/instance/compute?api-version=2021-02-01")
      read sub rg vm < <(echo "$meta" | python3 -c \
        'import sys,json;d=json.load(sys.stdin);print(d["subscriptionId"],d["resourceGroupName"],d["name"])')
      url="https://management.azure.com/subscriptions/${sub}/resourceGroups/${rg}/providers/Microsoft.Compute/virtualMachines/${vm}/deallocate?api-version=2023-07-01"
      code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
        -H "Authorization: Bearer ${tok}" -H 'Content-Length: 0' "$url")
      log "deallocate POST $url -> HTTP $code"

  - path: /etc/systemd/system/idle-deallocate.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Deallocate this VM after sustained GPU idle
      After=network-online.target
      [Service]
      Type=oneshot
      EnvironmentFile=/etc/idle-deallocate.env
      ExecStart=/usr/local/bin/idle-deallocate.sh

  - path: /etc/systemd/system/idle-deallocate.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Periodic GPU-idle check
      [Timer]
      OnBootSec=15min
      OnUnitActiveSec=5min
      [Install]
      WantedBy=timers.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now idle-deallocate.timer
